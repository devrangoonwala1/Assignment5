<!DOCTYPE html>
<html>
	<head>
		<title>Fancify Shamcify</title>

		<!-- link to your script file here -->
		<script src="fancifymytext.js"></script>
	</head>

	<body>
		<h1>Fancify my Text</h1>
		<fieldset>
			<legend>Text</legend>
			<textarea id="textingSize" rows="4" cols="30"></textarea>
		</fieldset>

		<!-- Your UI controls go here -->
		 <fieldset>
			<Legend>Fancify</Legend>
			
			<button type="button" id="biggerButton" onclick="buttonSize()">Bigger</button>

			<button type="button" id="mooButton" onclick="moo()">Moo</button>

			<input 
				type="radio" 
				id="fancy" 
				name="chooseRadio" 
				value="Shmancy" 
				onclick="changingRadioOption()"
				>
			<label for="fancy">FancyShmancy</label>
			
			<input 
				type="radio" 
				id="boring" 
				name="chooseRadio" 
				value="Betty" 
				onclick="changingRadioOption()"
			>
			<label for="boring">BoringBetty</label>

		 </fieldset>
		
	</body>
</html>
